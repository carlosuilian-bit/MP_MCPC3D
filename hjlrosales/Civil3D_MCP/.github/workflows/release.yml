name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  node:
    name: Node (server) - build & pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/server/Autodesk.Mcp.Server/package-lock.json
      - run: npm ci
        working-directory: src/server/Autodesk.Mcp.Server
      - run: npm run typecheck
        working-directory: src/server/Autodesk.Mcp.Server
      - run: npm run lint
        working-directory: src/server/Autodesk.Mcp.Server
      - run: npm test
        working-directory: src/server/Autodesk.Mcp.Server
      - run: npm run build
        working-directory: src/server/Autodesk.Mcp.Server
      - run: |
          mkdir -p "${{ github.workspace }}/artifacts/packages"
          npm pack --pack-destination "${{ github.workspace }}/artifacts/packages"
        working-directory: src/server/Autodesk.Mcp.Server
      - uses: actions/upload-artifact@v4
        with:
          name: server-package
          path: artifacts/packages/*.tgz
          if-no-files-found: error

  # The .NET solution is not actually SDK-free (domain and tools projects compile
  # Autodesk data sources), so it needs the Civil 3D SDK machine. Runs on the
  # self-hosted runner and uses the SDK already installed there. actions/setup-dotnet
  # cannot be used: it fails to detect the machine-wide SDK in the job environment
  # and attempts an admin-level install into C:\Program Files\dotnet.
  dotnet-core:
    name: .NET (core)
    runs-on: [self-hosted, windows, civil3d]
    defaults:
      run:
        # pwsh (PowerShell Core) is not on the runner's PATH; use Windows
        # PowerShell 5.1 which is always present on Windows hosts.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Add .NET SDK to PATH
        run: echo "C:\Program Files\dotnet" >> $env:GITHUB_PATH
      - run: dotnet build AutodeskMcp.Core.slnx -c Release --nologo
      - run: dotnet test AutodeskMcp.Core.slnx -c Release --nologo --no-build

  e2e:
    name: E2E (real server process)
    needs: node
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/server/Autodesk.Mcp.Server/package-lock.json
      - run: npm ci
        working-directory: src/server/Autodesk.Mcp.Server
      - run: npm run build
        working-directory: src/server/Autodesk.Mcp.Server
      - run: npm ci
        working-directory: e2e
      - run: npm test
        working-directory: e2e

  # Bridge bundle + full .NET suite. Requires a self-hosted Windows runner labeled
  # 'civil3d' with Civil 3D installed (Autodesk SDK). See docs/DeveloperGuide.md.
  bridge:
    name: Bridge bundle (Civil 3D SDK runner)
    runs-on: [self-hosted, windows, civil3d]
    defaults:
      run:
        # pwsh (PowerShell Core) is not on the runner's PATH; use Windows
        # PowerShell 5.1 which is always present on Windows hosts.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Add .NET SDK to PATH
        run: echo "C:\Program Files\dotnet" >> $env:GITHUB_PATH
      - run: dotnet build AutodeskMcp.slnx -c Release --nologo
      - run: dotnet test AutodeskMcp.slnx -c Release --nologo
      - run: node eng/scripts/build-bridge-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: civil3d-bridge-bundle
          path: artifacts/bundles/
          if-no-files-found: error

  # Publishes the server to npm. The publish step is skipped when the NPM_TOKEN
  # secret is not configured. The check lives inside the script (via the env var)
  # rather than in an `if:` condition, because the secrets context is not reliably
  # available in `if` expressions during workflow validation.
  npm-publish:
    name: Publish to npm
    needs: [node, dotnet-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: src/server/Autodesk.Mcp.Server
      - name: Publish to npm (skipped when NPM_TOKEN is not configured or the version already exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured - skipping npm publish"
          elif npm view "autodesk-mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "autodesk-mcp-server@$VERSION already published - skipping"
          else
            npm publish --provenance --access public
          fi
        working-directory: src/server/Autodesk.Mcp.Server

  github-release:
    name: GitHub Release
    needs: [node, dotnet-core, e2e, bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate release notes
        run: node eng/scripts/release-notes.mjs "${GITHUB_REF_NAME#v}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: server-package
          path: artifacts/server
      - uses: actions/download-artifact@v4
        with:
          name: civil3d-bridge-bundle
          path: artifacts/bridge
      - name: Build release manifest + checksums
        # The script scans the download dirs for the versioned artifact names and
        # writes both artifacts/release-manifest.json and artifacts/SHA256SUMS.
        run: node eng/scripts/release-manifest.mjs "${GITHUB_REF_NAME#v}" --server-dir artifacts/server --bundle-dir artifacts/bridge
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: artifacts/release-notes/${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/server/*.tgz
            artifacts/bridge/**/*.zip
            artifacts/release-manifest.json
            artifacts/SHA256SUMS
